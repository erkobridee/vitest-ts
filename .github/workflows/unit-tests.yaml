name: Run unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pr-to-main-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  checks: write

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # https://github.com/pnpm/action-setup
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Run unit tests
        run: pnpm test-results

      - name: Report test results
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/test-results.xml'
          check_name: 'Test Report'
